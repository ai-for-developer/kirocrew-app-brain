# Include from the project's .gitlab-ci.yml (owned by the platform team; the bot cannot edit CI files).
# Make all five jobs required checks, reported by jobs the bot cannot fake (see the main plan §6: only checks the
# bot cannot write count as gates). They run in every MR pipeline, whatever the source branch is called: the bot can
# open an MR from any branch, and kit.json's branch_prefix need not be ai. On a branch that is not a run branch
# check-run has nothing to check; push-rules refuses the bot's pushes and commits there. brain-new-coverage and
# brain-migrations exit 3 for a warning. The pipeline shows the warning and the MR can still merge. Any other failure
# blocks the merge.
brain-run-check:
  stage: test
  image: ${BRAIN_CI_IMAGE}          # internal image with python3 (3.8+), git and openssh-client
  variables:
    GIT_DEPTH: "0"                  # brain_commit must be in history
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git clone -q --depth 1 --branch "${BRAIN_KIT_REF}" "${BRAIN_KIT_REPO}" /tmp/brain-kit
    # vouchers: read-only clone of brain-intake/vouchers (deploy token scoped to that repo, read_repository)
    - git clone -q --depth 1 "${BRAIN_INTAKE_VOUCHERS_REPO}" /tmp/brain-intake
    - export BRAIN_VOUCHERS_DIR=/tmp/brain-intake/vouchers
    - export BRAIN_ALLOWED_SIGNERS=/tmp/brain-kit/deploy/allowed_signers   # bridge public key, pinned with the kit
    - python3 /tmp/brain-kit/bin/brain-ci check-run

# GitLab Free has no server hooks: run the same rules here and make this job required too.
brain-push-rules:
  stage: test
  image: ${BRAIN_CI_IMAGE}
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git clone -q --depth 1 --branch "${BRAIN_KIT_REF}" "${BRAIN_KIT_REPO}" /tmp/brain-kit
    # in a pipeline the bot's push started, the hand-over voucher tells the owner's commits from the bot's
    - git clone -q --depth 1 "${BRAIN_INTAKE_VOUCHERS_REPO}" /tmp/brain-intake
    - export BRAIN_VOUCHERS_DIR=/tmp/brain-intake/vouchers
    - export BRAIN_ALLOWED_SIGNERS=/tmp/brain-kit/deploy/allowed_signers
    - python3 /tmp/brain-kit/bin/brain-ci push-rules

# The Brain's rules on every MR (Brain MRs from `brain reflect`, and anything else touching brain/):
# entries change only by same / adds-to / replaces / withdraws / purge, archives only grow, new text has no
# secrets, personal data, amounts or masked placeholders. Make it required; the warnings tell reviewers what to check.
brain-lint:
  stage: test
  image: ${BRAIN_CI_IMAGE}
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git clone -q --depth 1 --branch "${BRAIN_KIT_REF}" "${BRAIN_KIT_REPO}" /tmp/brain-kit
    - python3 /tmp/brain-kit/bin/brain-ci brain-lint

# The lines an MR adds need tests. brain-ci new-coverage fails when the tests run fewer than new_coverage.block %
# (default 60) of the executable lines the MR adds, and warns below new_coverage.warn % (default 80). Tests and
# new_coverage.ignore do not count. The thresholds come from the target branch's .brain/kit.json, so an MR cannot
# loosen its own gate. The project's test job must:
#   - write a Cobertura report (pytest --cov=<package> --cov-report=xml, or a converter) to $BRAIN_COVERAGE_REPORT
#     and list it under artifacts:paths (artifacts:reports alone does not reach other jobs);
#   - measure the whole source tree (--cov=<package>, coverage `source`): a file no test imports is otherwise not in
#     the report, and its lines are not counted;
#   - be the job in needs: below. Named otherwise? Override in your .gitlab-ci.yml:
#       brain-new-coverage:
#         needs: [{job: unit-tests, artifacts: true}]
# Without the report (the job did not run, the path is wrong, the file is not Cobertura) the check fails.
brain-new-coverage:
  stage: test
  image: ${BRAIN_CI_IMAGE}
  variables:
    GIT_DEPTH: "0"                          # the merge base with the target branch
    BRAIN_COVERAGE_REPORT: coverage.xml     # the test job's artifact, relative to the project directory
  needs:
    - job: test
      artifacts: true
      optional: true                        # with no test job in the pipeline this job still runs, and fails
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure:
    exit_codes: [3]
  script:
    - git clone -q --depth 1 --branch "${BRAIN_KIT_REF}" "${BRAIN_KIT_REPO}" /tmp/brain-kit
    - python3 /tmp/brain-kit/bin/brain-ci new-coverage

# During a canary the old version runs against the new schema, so the migrations an MR adds or changes
# (migrations.paths on the target branch, default migrations/*.sql) may only expand it. brain-ci migrations fails on
# DROP COLUMN, DROP TABLE, RENAME, ALTER COLUMN ... TYPE, ADD COLUMN ... NOT NULL without DEFAULT, SET NOT NULL,
# CREATE INDEX without CONCURRENTLY on an existing table, and any edit to a merged migration. A deliberate contract
# step gets `-- brain: contract <rule-id> <reason>` directly above the statement: its failure becomes a warning that
# names the reason, for the reviewer.
brain-migrations:
  stage: test
  image: ${BRAIN_CI_IMAGE}
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure:
    exit_codes: [3]
  script:
    - git clone -q --depth 1 --branch "${BRAIN_KIT_REF}" "${BRAIN_KIT_REPO}" /tmp/brain-kit
    - python3 /tmp/brain-kit/bin/brain-ci migrations
